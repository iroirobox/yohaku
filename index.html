<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9">
  <title>余白 — 縦書き創作帳</title>
  <style>
:root {
  --bg: #f4f1e9;
  --paper: #fffdf8;
  --ink: #252522;
  --muted: #77756d;
  --line: #ddd8cc;
  --accent: #4f6251;
  --accent-dark: #39483a;
  --shadow: 0 18px 45px rgba(45, 42, 34, .10);
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
}

button, input, select, textarea { font: inherit; }

button { cursor: pointer; }

.topbar {
  height: 66px;
  padding: 0 18px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  border-bottom: 1px solid rgba(70,65,55,.08);
  background: rgba(244,241,233,.94);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(10px);
}

.brand { text-align: center; line-height: 1.15; }
.brand-title { font-size: 17px; letter-spacing: .22em; margin-left: .22em; }
.brand-sub { font-family: sans-serif; font-size: 9px; letter-spacing: .16em; color: var(--muted); margin-top: 4px; }
.text-button, .icon-button { background: none; border: 0; color: var(--ink); }
.text-button { justify-self: start; font-size: 13px; }
.icon-button { justify-self: end; font-size: 19px; }

main { width: min(100%, 980px); margin: 0 auto; }

.view { padding: 34px 18px 60px; }

.library-head {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: end;
  margin-bottom: 34px;
}

.eyebrow {
  margin: 0 0 7px;
  color: var(--muted);
  font-family: sans-serif;
  font-size: 9px;
  letter-spacing: .2em;
}

h1, h2 { font-weight: 500; margin: 0; }
h1 { font-size: 31px; letter-spacing: .08em; }
h2 { font-size: 23px; letter-spacing: .08em; }
.lead { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

.primary-button, .secondary-button {
  border-radius: 2px;
  padding: 11px 16px;
  min-height: 42px;
  transition: .2s ease;
}
.primary-button { border: 1px solid var(--accent); background: var(--accent); color: white; }
.secondary-button { border: 1px solid var(--line); background: rgba(255,253,248,.55); color: var(--ink); }
.primary-button:hover { background: var(--accent-dark); }

.book-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.book-card {
  min-height: 150px;
  padding: 20px;
  background: var(--paper);
  border: 1px solid rgba(70,65,55,.08);
  box-shadow: 0 8px 25px rgba(45,42,34,.04);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.book-card h3 { font-size: 18px; font-weight: 500; margin: 0; }
.book-meta { color: var(--muted); font-family: sans-serif; font-size: 10px; letter-spacing: .04em; }
.book-open { border: 0; background: none; padding: 0; text-align: left; color: inherit; }
.card-bottom { display: flex; justify-content: space-between; align-items: end; }
.empty { grid-column: 1 / -1; text-align: center; padding: 80px 10px; color: var(--muted); }
.library-tools { display: flex; gap: 8px; margin-top: 25px; }
.file-label { display: inline-flex; align-items: center; }
.save-note { color: var(--muted); font-family: sans-serif; font-size: 10px; line-height: 1.7; margin-top: 15px; }

.editor-head { display: flex; justify-content: space-between; align-items: end; gap: 15px; margin-bottom: 20px; }
.page-info { margin: 7px 0 0; color: var(--muted); font-family: sans-serif; font-size: 11px; }
.editor-actions { display: flex; gap: 7px; }

.book-stage {
  min-height: calc(100vh - 200px);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 12px 0 30px;
}

.book-page-wrap { width: min(82vw, 420px); }
.book-page {
  width: 100%;
  aspect-ratio: 148 / 210;
  background: var(--paper);
  box-shadow: var(--shadow);
  padding: 11% 10% 11% 12%;
  position: relative;
  overflow: hidden;
}
.page-number {
  position: absolute;
  bottom: 3.8%;
  font-family: sans-serif;
  font-size: 7px;
  color: var(--muted);
  letter-spacing: .04em;
  pointer-events: none;
}
.page-number.center { left: 50%; transform: translateX(-50%); }
.page-number.inside { left: 12%; }
.page-number.outside { right: 12%; }

#pageText {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
}
.writing-surface {
  display: block;
  box-sizing: border-box;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-family: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
  font-weight: 400;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  line-height: 1.8;
  letter-spacing: .04em;
  white-space: pre-wrap;
  word-break: break-all;
  padding: 0;
  margin: 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(79,98,81,.38) transparent;
  caret-color: var(--accent);
  caret-shape: bar;
  cursor: text;
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: none;
}
.writing-surface:empty::before {
  content: attr(data-placeholder);
  color: rgba(119,117,109,.45);
  pointer-events: none;
}
.writing-surface::-webkit-scrollbar { height: 4px; }
.writing-surface::-webkit-scrollbar-track { background: transparent; }
.writing-surface::-webkit-scrollbar-thumb { background: rgba(79,98,81,.30); border-radius: 99px; }
.writing-surface:focus { outline: none; }

.editor-footer {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-family: sans-serif;
  font-size: 10px;
  padding: 0 3px;
}

dialog {
  border: 0;
  padding: 0;
  width: min(92vw, 470px);
  background: transparent;
}
dialog::backdrop { background: rgba(35,32,26,.32); backdrop-filter: blur(3px); }

.dialog-card {
  position: relative;
  display: block;
  padding: 28px;
  width: 100%;
  background: var(--paper);
  box-shadow: var(--shadow);
}
.dialog-close { position: absolute; top: 11px; right: 13px; border: 0; background: none; font-size: 24px; color: var(--muted); }
.dialog-card .field {
  display: block;
  width: 100%;
  min-width: 0;
  font-family: sans-serif;
  font-size: 11px;
  color: var(--muted);
  margin-top: 17px;
}
.dialog-card .field > span { display: block; }
.dialog-card input, .dialog-card select {
  display: block;
  width: 100%;
  margin-top: 7px;
  padding: 11px 10px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  border-radius: 1px;
}
.two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 25px; }

@media (min-width: 620px) {
  .view { padding-left: 28px; padding-right: 28px; }
  .book-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 480px) {
  .library-head { display: block; }
  .library-head .primary-button { width: 100%; }
  .editor-head { align-items: flex-start; flex-direction: column; }
  .editor-actions { width: 100%; }
  .editor-actions button { flex: 1; }
  .book-stage { min-height: auto; }
  .book-page-wrap { width: min(90vw, 380px); }
  .two-cols { gap: 8px; }
}

</style>
</head>
<body>
  <header class="topbar">
    <button class="text-button" id="backButton" type="button" hidden>ホーム</button>
    <div class="brand">
      <div class="brand-title">余白</div>
      <div class="brand-sub">縦書き創作帳</div>
    </div>
    <button class="icon-button" id="settingsButton" type="button" aria-label="作品設定" hidden>⚙</button>
  </header>

  <main>
    <section id="libraryView" class="view">
      <div class="library-head">
        <button class="primary-button" id="newBookButton" type="button">＋ 新しい作品</button>
      </div>

      <div id="bookList" class="book-list"></div>

      <div class="library-tools">
        <button class="secondary-button" id="backupButton" type="button">バックアップ</button>
        <label class="secondary-button file-label">
          復元
          <input id="restoreInput" type="file" accept=".json,application/json" hidden>
        </label>
      </div>
      <p class="save-note">作品はこのブラウザ内に自動保存されます。大切な作品は定期的にバックアップしてください。</p>
    </section>

    <section id="editorView" class="view" hidden>
      <div class="editor-head">
        <div>
          <p class="eyebrow">WRITING</p>
          <h1 id="editorTitle">無題</h1>
          <p id="pageInfo" class="page-info"></p>
        </div>
        <div class="editor-actions">
          <button class="secondary-button" id="prevPageButton" type="button">前へ</button>
          <button class="secondary-button" id="nextPageButton" type="button">次へ</button>
          <button class="secondary-button" id="pdfButton" type="button">PDFを作る</button>
        </div>
      </div>

      <div class="book-stage">
        <div class="book-page-wrap">
          <div id="bookPage" class="book-page" tabindex="0" aria-label="縦書き本文">
            <div id="pageText" class="writing-surface" contenteditable="true" role="textbox" aria-label="本文" spellcheck="false" autocorrect="off" autocapitalize="off" data-placeholder="ここから書きはじめる"></div>
          </div>
        </div>
      </div>

      <div class="editor-footer">
        <span id="saveStatus">自動保存</span>
        <span id="characterCount">0文字</span>
      </div>
    </section>
  </main>

  <dialog id="bookDialog">
    <form id="bookForm" class="dialog-card">
      <button class="dialog-close" type="button" id="dialogCloseButton" aria-label="閉じる">×</button>
      <p class="eyebrow">SETTINGS</p>
      <h2 id="dialogTitle">新しい作品</h2>
      <label>
        作品名
        <input id="bookName" maxlength="120" required placeholder="例：夜の向こう側">
      </label>
      <label>
        本のサイズ
        <select id="bookSize">
          <option value="bunko">文庫サイズ</option>
          <option value="shinsho">新書サイズ</option>
          <option value="a5">A5サイズ</option>
        </select>
      </label>
      <div class="two-cols">
        <label>
          1行の文字数
          <input id="charsPerLine" type="number" min="5" max="60" value="20">
        </label>
        <label>
          1ページの行数
          <input id="linesPerPage" type="number" min="5" max="40" value="16">
        </label>
      </div>
      <div class="two-cols">
        <label>
          文字サイズ
          <input id="fontSize" type="number" min="8" max="36" value="16">
        </label>
        <label>
          行間
          <input id="lineGap" type="number" min="1" max="3" step="0.1" value="1.8">
        </label>
      </div>
      <div class="two-cols">
        <label>
          ノド側の余白
          <input id="gutter" type="number" min="0" max="40" value="4">
        </label>
        <label>
          版面の上下余白
          <input id="verticalMargin" type="number" min="5" max="25" value="11">
        </label>
      </div>
      <div class="two-cols">
        <label>
          ページ番号
          <select id="pageNumberPosition">
            <option value="bottom-center">下・中央</option>
            <option value="bottom-outside">下・小口側</option>
            <option value="bottom-inside">下・ノド側</option>
            <option value="none">表示しない</option>
          </select>
        </label>
        <label>
          開始ページ番号
          <input id="startPageNumber" type="number" min="1" max="9999" value="1">
        </label>
      </div>
      <div class="dialog-actions">
        <button class="secondary-button" type="button" id="dialogCancelButton">キャンセル</button>
        <button class="primary-button" id="dialogSubmitButton" value="default">作成する</button>
      </div>
    </form>
  </dialog>
</body>
<script>
const DB_NAME = "YohakuCreativeDB";
const DB_VERSION = 1;
const STORE = "app";
const STATE_KEY = "state";

let state = { books: [], activeBookId: null };
let currentBook = null;
let currentPage = 0;
let dialogMode = "new";
let saveTimer = null;
let inputUiTimer = null;
let savePromise = null;
let paginationTimer = null;

const $ = (id) => document.getElementById(id);

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => request.result.createObjectStore(STORE);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function loadState() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get(STATE_KEY);
    req.onsuccess = () => {
      state = req.result || { books: [], activeBookId: null };
      resolve(state);
    };
    req.onerror = () => reject(req.error);
  });
}

async function saveState() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(state, STATE_KEY);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function showLibrary() {
  currentBook = null;
  $("editorView").hidden = true;
  $("libraryView").hidden = false;
  $("backButton").hidden = true;
  $("settingsButton").hidden = true;
  renderLibrary();
}

function showEditor(book) {
  currentBook = book;
  currentPage = 0;
  state.activeBookId = book.id;
  saveState();
  $("libraryView").hidden = true;
  $("editorView").hidden = false;
  $("backButton").hidden = false;
  $("settingsButton").hidden = false;
  $("editorTitle").textContent = book.name || "無題";
  applyBookStyle(book);
  renderPage(true);
}

function renderLibrary() {
  const list = $("bookList");
  list.innerHTML = "";
  if (!state.books.length) {
    list.innerHTML = '<div class="empty">まだ作品がありません。<br>最初の一冊を書きはじめましょう。</div>';
    return;
  }
  [...state.books].sort((a,b) => b.updatedAt - a.updatedAt).forEach(book => {
    const card = document.createElement("article");
    card.className = "book-card";
    card.innerHTML = `
      <button class="book-open" type="button">
        <p class="eyebrow">BOOK</p>
        <h3>${escapeHtml(book.name || "無題")}</h3>
      </button>
      <div class="card-bottom">
        <span class="book-meta">${book.pages.length}ページ・${countBookChars(book)}文字</span>
        <span class="book-meta">${formatDate(book.updatedAt)}</span>
      </div>`;
    card.querySelector(".book-open").addEventListener("click", () => showEditor(book));
    list.appendChild(card);
  });
}

function createBookFromForm() {
  const book = {
    id: uid(),
    name: $("bookName").value.trim(),
    size: $("bookSize").value,
    charsPerLine: clamp(Number($("charsPerLine").value) || 20, 5, 60),
    linesPerPage: clamp(Number($("linesPerPage").value) || 16, 5, 40),
    fontSize: clamp(Number($("fontSize").value) || 16, 8, 36),
    lineGap: clamp(Number($("lineGap").value) || 1.8, 1, 3),
    gutter: clamp(Number($("gutter").value) || 4, 0, 40),
    verticalMargin: clamp(Number($("verticalMargin").value) || 11, 5, 25),
    pageNumberPosition: $("pageNumberPosition").value || "bottom-center",
    startPageNumber: clamp(Number($("startPageNumber").value) || 1, 1, 9999),
    pages: [""],
    updatedAt: Date.now()
  };
  state.books.push(book);
  saveState();
  $("bookDialog").close();
  $("bookForm").reset();
  showEditor(book);
}

function editorText() {
  const el = $("pageText");
  return normalizeLineBreaks(el.innerText || "");
}

function renderPage(focus = false) {
  if (!currentBook) return;
  const total = currentBook.pages.length;
  const pageText = $("pageText");
  // 入力中はDOMを書き換えない。ページ移動時だけ内容を差し替える。
  pageText.textContent = currentBook.pages[currentPage] || "";
  $("pageInfo").textContent = `本文 ${currentPage + 1} / ${total}　｜　本のページ ${currentBook.startPageNumber + currentPage}`;
  renderPageNumber();
  $("characterCount").textContent = `${countBookChars(currentBook)}文字`;
  $("saveStatus").textContent = "自動保存";
  $("prevPageButton").disabled = currentPage === 0;
  $("nextPageButton").textContent = currentPage === total - 1 ? "次のページ ＋" : "次へ";
  if (focus) requestAnimationFrame(() => pageText.focus({preventScroll:true}));
}

function updateCurrentPageInMemory() {
  if (!currentBook) return;
  currentBook.pages[currentPage] = editorText();
  currentBook.updatedAt = Date.now();
  $("characterCount").textContent = `${countBookChars(currentBook)}文字`;
}

function scheduleSave() {
  if (!currentBook) return;
  $("saveStatus").textContent = "保存中…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    updateCurrentPageInMemory();
    if (savePromise) await savePromise;
    savePromise = saveState();
    try { await savePromise; } finally { savePromise = null; }
    $("saveStatus").textContent = "自動保存";
  }, 800);
}

function saveCurrentPage() {
  if (!currentBook) return;
  clearTimeout(saveTimer);
  updateCurrentPageInMemory();
  savePromise = saveState();
  savePromise.finally(() => { savePromise = null; });
  $("saveStatus").textContent = "自動保存";
}

function goPage(delta) {
  if (!currentBook) return;
  clearTimeout(saveTimer);
  updateCurrentPageInMemory();
  normalizeCurrentPages();
  currentBook.updatedAt = Date.now();
  saveState();
  const target = currentPage + delta;
  if (target < 0) return;
  if (target >= currentBook.pages.length) currentBook.pages.push("");
  currentPage = target;
  renderPage();
  requestAnimationFrame(() => $("pageText").focus({preventScroll:true}));
}

function applyBookStyle(book) {
  const font = Math.max(10, Math.min(28, book.fontSize));
  const vertical = clamp(Number(book.verticalMargin) || 11, 5, 25);
  const gutter = clamp(Number(book.gutter) || 4, 0, 40);
  $("pageText").style.fontSize = `${font}px`;
  $("pageText").style.lineHeight = String(book.lineGap || 1.8);
  $("bookPage").style.paddingTop = `${vertical}%`;
  $("bookPage").style.paddingBottom = `${vertical}%`;
  $("bookPage").style.paddingRight = `calc(10% + ${gutter}px)`;
  $("bookPage").style.paddingLeft = `12%`;
  const ratios = { bunko: "105 / 148", shinsho: "103 / 182", a5: "148 / 210" };
  $("bookPage").style.aspectRatio = ratios[book.size] || ratios.bunko;
}

function renderPageNumber() {
  let el = $("pageNumber");
  if (!el) {
    el = document.createElement("span");
    el.id = "pageNumber";
    el.className = "page-number";
    $("bookPage").appendChild(el);
  }
  const pos = currentBook?.pageNumberPosition || "bottom-center";
  el.textContent = currentBook ? String(currentBook.startPageNumber + currentPage) : "";
  el.className = `page-number ${pos === "bottom-center" ? "center" : pos === "bottom-inside" ? "inside" : pos === "bottom-outside" ? "outside" : "none"}`;
  el.hidden = pos === "none";
}

function normalizeLineBreaks(text) {
  return String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
}

function paginateText(text, charsPerLine, linesPerPage) {
  const cpl = clamp(Number(charsPerLine) || 20, 5, 60);
  const lpp = clamp(Number(linesPerPage) || 16, 5, 40);
  const source = normalizeLineBreaks(text);
  const pages = [];
  let pageLines = [];
  let line = "";

  const pushLine = () => {
    pageLines.push(line);
    line = "";
    if (pageLines.length >= lpp) {
      pages.push(pageLines.join("\n"));
      pageLines = [];
    }
  };

  for (const ch of source) {
    if (ch === "\n") { pushLine(); continue; }
    line += ch;
    if (line.length >= cpl) {
      // Japanese manuscript-friendly kinsoku: avoid starting a line with common closing punctuation.
      const last = line.at(-1) || "";
      const kinsoku = "、。，．・：；？！)]}〉》」』】〕）］｝!?";
      if (kinsoku.includes(last) && line.length > 1) {
        const moved = line.at(-1);
        line = line.slice(0, -1);
        pushLine();
        line = moved;
      } else {
        pushLine();
      }
    }
  }
  if (line.length || pageLines.length || !pages.length) pushLine();
  if (!pageLines.length && pages.at(-1) === "") pages.pop();
  return pages.length ? pages : [""];
}

function normalizeCurrentPages() {
  if (!currentBook) return;
  const combined = currentBook.pages.map(normalizeLineBreaks).join("\n");
  const pages = paginateText(combined, currentBook.charsPerLine, currentBook.linesPerPage);
  currentBook.pages = pages;
  currentPage = clamp(currentPage, 0, pages.length - 1);
}

function countBookChars(book) {
  return book.pages.join("").replace(/\n/g, "").length;
}

function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

$("dialogCloseButton").addEventListener("click", () => $("bookDialog").close());
$("dialogCancelButton").addEventListener("click", () => $("bookDialog").close());

$("bookDialog").addEventListener("click", (event) => {
  if (event.target === $("bookDialog")) $("bookDialog").close();
});

$("newBookButton").addEventListener("click", () => {
  dialogMode = "new";
  $("dialogTitle").textContent = "新しい作品";
  $("dialogSubmitButton").textContent = "作成する";
  $("bookForm").reset();
  $("bookSize").value = "bunko";
  $("charsPerLine").value = 20;
  $("linesPerPage").value = 16;
  $("fontSize").value = 16;
  $("lineGap").value = 1.8;
  $("gutter").value = 4;
  $("verticalMargin").value = 11;

  $("bookDialog").showModal();

});

$("bookForm").addEventListener("submit", (e) => {

    currentBook.name = $("bookName").value.trim() || "無題";
    currentBook.size = $("bookSize").value;
    currentBook.charsPerLine = clamp(Number($("charsPerLine").value) || 20, 5, 60);
    currentBook.linesPerPage = clamp(Number($("linesPerPage").value) || 16, 5, 40);
    currentBook.fontSize = clamp(Number($("fontSize").value) || 16, 8, 36);
    currentBook.lineGap = clamp(Number($("lineGap").value) || 1.8, 1, 3);
    currentBook.gutter = clamp(Number($("gutter").value) || 4, 0, 40);
    currentBook.verticalMargin = clamp(Number($("verticalMargin").value) || 11, 5, 25);
    currentBook.pageNumberPosition = $("pageNumberPosition").value || "bottom-center";
    currentBook.startPageNumber = clamp(Number($("startPageNumber").value) || 1, 1, 9999);
    currentBook.updatedAt = Date.now();
    saveState();
    $("bookDialog").close();

function bookDimensions(book) {
  if (book.size === "shinsho") return { w: 103, h: 182 };
  if (book.size === "a5") return { w: 148, h: 210 };
  return { w: 105, h: 148 };
}

function drawVerticalPage(canvas, book, text, pageIndex) {
  const dim = bookDimensions(book);
  const scale = 4;
  canvas.width = Math.round(dim.w * scale);
  canvas.height = Math.round(dim.h * scale);
  const ctx = canvas.getContext("2d", { alpha: false });
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#fffefa";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const top = canvas.height * (clamp(Number(book.verticalMargin) || 11, 5, 25) / 100);
  const bottom = canvas.height * (clamp(Number(book.verticalMargin) || 11, 5, 25) / 100);
  const inner = canvas.width * (0.10 + clamp(Number(book.gutter) || 4, 0, 40) / 100);
  const outer = canvas.width * 0.10;
  const usableW = Math.max(1, canvas.width - inner - outer);
  const usableH = Math.max(1, canvas.height - top - bottom);
  const cpl = clamp(Number(book.charsPerLine) || 20, 5, 60);
  const lpp = clamp(Number(book.linesPerPage) || 16, 5, 40);
  const fontPx = Math.max(10, Math.min(28, Number(book.fontSize) || 16)) * scale;
  const charStep = usableH / cpl;
  const colStep = usableW / lpp;

  ctx.fillStyle = "#2f2d28";
  ctx.font = `400 ${fontPx}px serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const rawLines = normalizeLineBreaks(text).split("\n");
  const columns = [];
  for (const raw of rawLines) {
    if (raw === "") { columns.push(""); continue; }
    let rest = raw;
    while (rest.length > cpl) {
      let cut = cpl;
      const next = rest[cut];
      const closing = "、。，．・：；？！)]}〉》」』】〕）］｝!?」』】";
      if (next && closing.includes(next) && cut > 1) cut--;
      columns.push(rest.slice(0, cut));
      rest = rest.slice(cut);
    }
    columns.push(rest);
  }

  columns.slice(0, lpp).forEach((line, i) => {
    const x = canvas.width - inner - colStep * (i + 0.5);
    [...line].forEach((ch, j) => {
      const y = top + charStep * (j + 0.5);
      ctx.fillText(ch, x, y);
    });
  });

  const pos = book.pageNumberPosition || "bottom-center";
  if (pos !== "none") {
    ctx.font = `400 ${5.5 * scale}px sans-serif`;
    ctx.fillStyle = "#77736b";
    const number = String((Number(book.startPageNumber) || 1) + pageIndex);
    const y = canvas.height - canvas.height * 0.025;
    const x = pos === "bottom-center" ? canvas.width / 2 : pos === "bottom-inside" ? canvas.width * 0.10 : canvas.width * 0.90;
    ctx.fillText(number, x, y);
  }
}

function dataUrlToBytes(dataUrl) {
  const base64 = dataUrl.split(",")[1];
  const bin = atob(base64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function buildImagePdf(images, pageWmm, pageHmm) {
  const enc = new TextEncoder();
  const chunks = [];
  const offsets = [0];
  let length = 0;
  const push = (x) => { const b = typeof x === "string" ? enc.encode(x) : x; chunks.push(b); length += b.length; };
  const objects = [];
  let objNum = 1;
  const catalog = objNum++; const pagesObj = objNum++;
  const pageObjs = images.map(() => objNum++);
  const imageObjs = images.map(() => objNum++);
  const contentObjs = images.map(() => objNum++);

  push("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");
  const writeObj = (n, body, binary) => { offsets[n] = length; push(`${n} 0 obj\n`); if (binary) push(body); else push(body); push("\nendobj\n"); };
  writeObj(catalog, `<< /Type /Catalog /Pages ${pagesObj} 0 R >>`);
  writeObj(pagesObj, `<< /Type /Pages /Kids [${pageObjs.map(n => `${n} 0 R`).join(" ")}] /Count ${images.length} >>`);

  images.forEach((img, i) => {
    const bytes = dataUrlToBytes(img.dataUrl);
    offsets[imageObjs[i]] = length;
    push(`${imageObjs[i]} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${img.width} /Height ${img.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
    push(bytes);
    push("\nendstream\nendobj\n");
    const w = pageWmm * 72 / 25.4; const h = pageHmm * 72 / 25.4;
    const stream = `q\n${w} 0 0 ${h} 0 0 cm\n/Im0 Do\nQ\n`;
    writeObj(contentObjs[i], `<< /Length ${enc.encode(stream).length} >>\nstream\n${stream}endstream`);
    writeObj(pageObjs[i], `<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 ${imageObjs[i]} 0 R >> >> /Contents ${contentObjs[i]} 0 R >>`);
  });
  const xref = length;
  push(`xref\n0 ${objNum}\n0000000000 65535 f \n`);
  for (let n = 1; n < objNum; n++) push(`${String(offsets[n] || 0).padStart(10, "0")} 00000 n \n`);
  push(`trailer\n<< /Size ${objNum} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const total = new Uint8Array(length); let at = 0; for (const c of chunks) { total.set(c, at); at += c.length; }
  return total;
}

async function generatePdf() {
  if (!currentBook) return;
  saveCurrentPage();
  normalizeCurrentPages();
  renderPage();
  const canvas = document.createElement("canvas");
  const dim = bookDimensions(currentBook);
  const images = [];
  for (let i = 0; i < currentBook.pages.length; i++) {
    drawVerticalPage(canvas, currentBook, currentBook.pages[i], i);
    images.push({ dataUrl: canvas.toDataURL("image/jpeg", 0.92), width: canvas.width, height: canvas.height });
    await new Promise(r => setTimeout(r, 0));
  }
  const pdf = buildImagePdf(images, dim.w, dim.h);
  const blob = new Blob([pdf], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${currentBook.name || "余白"}.pdf`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

$("pdfButton").addEventListener("click", generatePdf);

$("backupButton").addEventListener("click", () => {
  const payload = {
    format: "yohaku-backup",
    version: 1,
    exportedAt: new Date().toISOString(),
    state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `余白_バックアップ_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

$("restoreInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.format !== "yohaku-backup" || !data.state?.books) throw new Error();
    state = data.state;
    await saveState();
    showLibrary();
    alert("バックアップを復元しました。");
  } catch {
    alert("このバックアップファイルは読み込めませんでした。");
  }
  e.target.value = "";
});

async function init() {
  try {
    await loadState();
    state.books.forEach(book => {
      book.gutter ??= 4;
      book.verticalMargin ??= 11;
      book.pageNumberPosition ??= "bottom-center";
      book.charsPerLine ??= 20;
      book.linesPerPage ??= 16;
      book.fontSize ??= 16;
      book.lineGap ??= 1.8;
      book.startPageNumber ??= 1;
    });
    showLibrary();
  } catch (e) {
    console.error(e);
    alert("保存領域を初期化できませんでした。");
  }
}
init();
